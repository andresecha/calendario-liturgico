<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liturgical Calendar Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: linear-gradient(180deg, #0a0a0a 0%, #1a1a1a 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #e0e0e0;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
            border: 1px solid #380303;
            box-shadow: 0 0 60px rgba(135, 5, 5, 0.3);
            padding: 60px 50px;
        }
        h1 {
            color: #870505;
            text-align: center;
            margin-bottom: 12px;
            font-size: 2.8em;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
            border-bottom: 2px solid #380303;
            padding-bottom: 20px;
        }
        .subtitle {
            text-align: center;
            color: #999;
            margin-bottom: 50px;
            font-size: 1em;
            font-style: italic;
            letter-spacing: 1px;
        }
        .input-section {
            background: #0d0d0d;
            padding: 40px;
            border: 1px solid #380303;
            margin-bottom: 40px;
        }
        .form-group {
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }
        label {
            font-weight: 400;
            color: #ccc;
            font-size: 1.1em;
            letter-spacing: 1px;
        }
        input[type="number"] {
            padding: 14px 24px;
            background: #0a0a0a;
            border: 1px solid #380303;
            color: #e0e0e0;
            font-size: 1.1em;
            width: 180px;
            transition: all 0.3s ease;
            font-family: 'Georgia', 'Times New Roman', serif;
        }
        input[type="number"]:focus {
            outline: none;
            border-color: #870505;
            box-shadow: 0 0 15px rgba(135, 5, 5, 0.3);
        }
        button {
            padding: 14px 40px;
            background: #870505;
            color: #fff;
            border: 1px solid #380303;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: 'Georgia', 'Times New Roman', serif;
        }
        button:hover:not(:disabled) {
            background: #380303;
            box-shadow: 0 0 20px rgba(135, 5, 5, 0.5);
        }
        button:disabled {
            opacity: 0.5;
            cursor: wait;
        }
        .engine-status {
            text-align: center;
            color: #999;
            font-style: italic;
            letter-spacing: 1px;
            margin-top: 20px;
            font-size: 0.95em;
            min-height: 1.2em;
        }
        .error {
            background: #2a0000;
            border: 1px solid #870505;
            padding: 20px;
            margin: 30px 0;
            color: #ff6666;
            text-align: center;
            letter-spacing: 1px;
        }
        .result-section {
            margin-top: 50px;
        }
        .info-box {
            background: #0d0d0d;
            padding: 30px;
            border: 1px solid #380303;
            margin-bottom: 40px;
        }
        .info-box h3 {
            color: #870505;
            margin-bottom: 20px;
            font-size: 1.8em;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .info-box p {
            color: #aaa;
            line-height: 2;
            font-size: 1.05em;
            margin-bottom: 8px;
        }
        .info-box strong {
            color: #ccc;
            font-weight: 400;
        }
        h2 {
            color: #870505;
            margin-bottom: 30px;
            font-size: 1.6em;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-bottom: 1px solid #380303;
            padding-bottom: 15px;
        }
        .dates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .date-card {
            background: #0d0d0d;
            padding: 20px 24px;
            border: 1px solid #380303;
            transition: all 0.3s ease;
        }
        .date-card:hover {
            border-color: #870505;
            box-shadow: 0 0 20px rgba(135, 5, 5, 0.2);
        }
        .date-label {
            font-weight: 400;
            color: #999;
            margin-bottom: 10px;
            font-size: 0.95em;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .date-value {
            color: #ddd;
            font-size: 1.15em;
            font-family: 'Courier New', monospace;
        }
        .advent-sundays {
            border-color: #870505;
            background: #1a0000;
        }
        .advent-sundays .date-label {
            color: #870505;
        }
        footer {
            text-align: center;
            margin-top: 60px;
            padding-top: 30px;
            border-top: 1px solid #380303;
            color: #666;
        }
        footer p {
            margin: 8px 0;
            font-size: 0.95em;
            letter-spacing: 1px;
        }
        footer strong {
            color: #870505;
            font-weight: 400;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Liturgical Calendar</h1>
        <p class="subtitle">Historical Liturgical Date Calculator | Julian &amp; Gregorian Calendars</p>

        <div class="input-section">
            <form id="calc-form" class="form-group">
                <label for="year">Year</label>
                <input type="number" id="year" name="year"
                       min="532" max="9999" required>
                <button type="submit" id="calc-button" disabled>Calculate</button>
            </form>
            <div class="engine-status" id="engine-status">Loading calculation engine&hellip;</div>
        </div>

        <div id="error-slot"></div>
        <div id="result-slot"></div>

        <footer>
            <p><strong>Liturgical Calendar Library</strong> <span id="lib-version">v0.1.0</span></p>
            <p>&copy; Andrés Echavarria Pelaez</p>
            <img src="https://cst-ariane.huma-num.fr/logos/ariane.png"
     style="height: 60px;
            vertical-align: middle;
            margin: 0 5px;
            background: white;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 1)"/>
            <p>For historians and liturgical experts</p>
            <p style="margin-top: 15px; font-size: 0.8em;">
                Etalab Open License 2.0
            </p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
    <script>
        // Keys rendered as plain cards are everything except these metadata/
        // special keys, matching the server-rendered template exactly.
        const EXCLUDED_KEYS = ['Year', 'Calendar', 'Is Leap Year', 'Lent', 'Advent Sundays'];

        const statusEl = document.getElementById('engine-status');
        const buttonEl = document.getElementById('calc-button');
        const formEl = document.getElementById('calc-form');
        const errorSlot = document.getElementById('error-slot');
        const resultSlot = document.getElementById('result-slot');

        let computeFn = null;

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function showError(message) {
            resultSlot.innerHTML = '';
            errorSlot.innerHTML =
                '<div class="error"><strong>Error:</strong> ' + escapeHtml(message) + '</div>';
        }

        function render(result) {
            errorSlot.innerHTML = '';

            const leap = result['Is Leap Year'] ? 'Yes' : 'No';
            let cards = '';

            // Plain date cards, in the dictionary's own insertion order.
            for (const key of Object.keys(result)) {
                if (EXCLUDED_KEYS.indexOf(key) !== -1) continue;
                cards +=
                    '<div class="date-card">' +
                        '<div class="date-label">' + escapeHtml(key) + '</div>' +
                        '<div class="date-value">' + escapeHtml(result[key]) + '</div>' +
                    '</div>';
            }

            // Lent period card.
            if ('Lent' in result) {
                cards +=
                    '<div class="date-card">' +
                        '<div class="date-label">Lent Period</div>' +
                        '<div class="date-value">' + escapeHtml(result['Lent']) + '</div>' +
                    '</div>';
            }

            // Advent Sundays card (special styling).
            if ('Advent Sundays' in result) {
                let list = '';
                result['Advent Sundays'].forEach(function (sunday, i) {
                    list += (i + 1) + '. ' + escapeHtml(sunday) + '<br>';
                });
                cards +=
                    '<div class="date-card advent-sundays">' +
                        '<div class="date-label">Advent Sundays</div>' +
                        '<div class="date-value">' + list + '</div>' +
                    '</div>';
            }

            resultSlot.innerHTML =
                '<div class="result-section">' +
                    '<div class="info-box">' +
                        '<h3>Year ' + escapeHtml(result['Year']) + '</h3>' +
                        '<p><strong>Calendar Type:</strong> ' + escapeHtml(result['Calendar']) + '</p>' +
                        '<p><strong>Leap Year:</strong> ' + leap + '</p>' +
                    '</div>' +
                    '<h2>Liturgical Dates</h2>' +
                    '<div class="dates-grid">' + cards + '</div>' +
                '</div>';
        }

        // Absolute base dir inside Pyodide's virtual filesystem. Absolute paths
        // are required here: writing the package through a relative path fails
        // with ErrnoError/ENOENT regardless of the working directory.
        const PKG_BASE = '/lib_calendario';

        async function loadPackage(pyodide) {
            const manifest = await (await fetch('./pkg-manifest.json')).json();
            pyodide.FS.mkdir(PKG_BASE);
            pyodide.FS.mkdir(PKG_BASE + '/calendario_liturgico');
            for (const name of manifest) {
                const resp = await fetch('./calendario_liturgico/' + name);
                if (!resp.ok) {
                    throw new Error('Could not fetch ' + name + ' (HTTP ' + resp.status + ')');
                }
                pyodide.FS.writeFile(PKG_BASE + '/calendario_liturgico/' + name, await resp.text());
            }
            pyodide.runPython(
                "import sys\n" +
                "if '" + PKG_BASE + "' not in sys.path:\n" +
                "    sys.path.insert(0, '" + PKG_BASE + "')"
            );
        }

        async function boot() {
            try {
                const pyodide = await loadPyodide({
                    indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/'
                });
                await loadPackage(pyodide);

                // Build the compute helper once; it mirrors the Flask endpoint:
                // same error strings, same serialization (ISO dates via str()).
                computeFn = pyodide.runPython([
                    'import json, datetime',
                    'from calendario_liturgico import LiturgicalCalendar',
                    '',
                    'def _compute(year_str):',
                    '    try:',
                    '        year = int(year_str)',
                    '    except (ValueError, TypeError):',
                    '        return json.dumps({"error": "Invalid year"})',
                    '    try:',
                    '        cal = LiturgicalCalendar(year)',
                    '        dates = cal.get_all_dates()',
                    '        out = {}',
                    '        for key, value in dates.items():',
                    '            if isinstance(value, list):',
                    '                out[key] = [str(item) for item in value]',
                    '            elif isinstance(value, datetime.date):',
                    '                out[key] = str(value)',
                    '            else:',
                    '                out[key] = value',
                    '        return json.dumps({"result": out})',
                    '    except ValueError as exc:',
                    '        return json.dumps({"error": str(exc)})',
                    '    except Exception as exc:',
                    '        return json.dumps({"error": "Error: " + str(exc)})',
                    '',
                    '_compute'
                ].join('\n'));

                try {
                    const version = pyodide.runPython(
                        'from calendario_liturgico import __version__\n__version__'
                    );
                    document.getElementById('lib-version').textContent = 'v' + version;
                } catch (e) {
                    // Version is cosmetic; ignore if unavailable.
                }

                statusEl.textContent = '';
                buttonEl.disabled = false;
            } catch (err) {
                statusEl.textContent = '';
                const detail = (err && err.message) ? err.message : String(err);
                showError('Could not load the calculation engine (' + detail + '). Check your connection and reload.');
                console.error(err);
            }
        }

        formEl.addEventListener('submit', function (event) {
            event.preventDefault();
            if (!computeFn) return;
            const yearValue = document.getElementById('year').value;
            let payload;
            try {
                payload = JSON.parse(computeFn(yearValue));
            } catch (err) {
                showError('Unexpected error during calculation.');
                console.error(err);
                return;
            }
            if (payload.error) {
                showError(payload.error);
            } else {
                render(payload.result);
            }
        });

        boot();
    </script>
</body>
</html>
